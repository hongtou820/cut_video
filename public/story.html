<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>故事 - 次元聊</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .story-page { margin-left: var(--sidebar-w); min-height: 100vh; }

    .story-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      background: rgba(13,13,20,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .story-topbar h2 { font-size: 18px; font-weight: 700; }
    .story-topbar .mobile-menu {
      display: none; background: none; border: none;
      color: var(--text); font-size: 22px; cursor: pointer;
    }

    .story-tabs {
      display: flex; gap: 6px; padding: 16px 28px 0;
      flex-wrap: wrap;
    }
    .story-tab {
      padding: 7px 20px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text2); font-size: 13px; cursor: pointer; transition: all 0.25s;
    }
    .story-tab:hover { border-color: var(--accent); color: var(--text); }
    .story-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ===== Waterfall / Masonry Grid ===== */
    .waterfall-wrap {
      padding: 20px 24px 60px;
    }
    .waterfall {
      column-count: 3;
      column-gap: 16px;
    }
    @media (max-width: 1100px) { .waterfall { column-count: 2; } }
    @media (max-width: 600px) { .waterfall { column-count: 2; column-gap: 10px; } .waterfall-wrap { padding: 12px 10px 60px; } }

    /* ===== Waterfall Card ===== */
    .wf-card {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--bg2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25,0.8,0.25,1);
      position: relative;
    }
    .wf-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px rgba(124,91,245,0.1);
      border-color: rgba(124,91,245,0.25);
    }
    .wf-card-img {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: var(--bg3);
    }
    .wf-card-img img {
      width: 100%;
      display: block;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.5s;
    }
    .wf-card:hover .wf-card-img img { transform: scale(1.05); }

    /* Vary card image heights for masonry effect */
    .wf-card.wf-tall .wf-card-img img { aspect-ratio: 3/5; }
    .wf-card.wf-medium .wf-card-img img { aspect-ratio: 3/4; }
    .wf-card.wf-short .wf-card-img img { aspect-ratio: 4/4; }

    .wf-card-img .wf-category {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 10px;
      color: #fff;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .wf-card-body {
      padding: 12px 14px;
    }
    .wf-card-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .wf-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wf-card-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wf-card-avatar {
      width: 24px; height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent);
    }
    .wf-card-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
    }
    .wf-card-likes {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text3);
    }
    .wf-card-likes .heart {
      font-size: 14px;
      transition: transform 0.2s;
    }
    .wf-card:hover .wf-card-likes .heart { transform: scale(1.2); }

    /* ===== Fullscreen TikTok Viewer ===== */
    .tk-viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
    }
    .tk-viewer.open { display: flex; flex-direction: column; }

    .tk-viewer-close {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 1020;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      width: 40px; height: 40px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .tk-viewer-close:hover { background: rgba(255,255,255,0.25); }

    /* Progress dots on the right */
    .tk-progress {
      position: fixed;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1020;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .tk-progress-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: all 0.3s;
    }
    .tk-progress-dot.active {
      background: #fff;
      width: 6px; height: 18px;
      border-radius: 3px;
    }

    /* Scroll container */
    .tk-scroll {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tk-scroll::-webkit-scrollbar { display: none; }

    /* Each story slide */
    .tk-slide {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      overflow: hidden;
    }

    .tk-slide-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      filter: blur(2px) brightness(0.45);
      transform: scale(1.05);
    }

    .tk-slide-img-sharp {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      opacity: 0.7;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 75%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 75%);
    }

    .tk-slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.3) 0%,
        transparent 25%,
        transparent 40%,
        rgba(0,0,0,0.65) 70%,
        rgba(0,0,0,0.85) 100%
      );
    }

    .tk-slide-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 16px 90px 16px;
      z-index: 5;
    }

    /* Top-left: character info */
    .tk-header {
      position: absolute;
      top: 60px; left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .tk-header-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.6);
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .tk-header-info { display: flex; flex-direction: column; }
    .tk-header-name {
      color: #fff; font-size: 16px; font-weight: 700;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .tk-header-title {
      color: rgba(255,255,255,0.65); font-size: 12px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* Story text at bottom */
    .tk-scene {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-style: italic;
      margin-bottom: 8px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .tk-story-text {
      color: #fff;
      font-size: 15px;
      line-height: 1.7;
      font-weight: 400;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
      max-height: 40vh;
      overflow-y: auto;
      scrollbar-width: none;
      padding-right: 60px; /* room for action buttons */
    }
    .tk-story-text::-webkit-scrollbar { display: none; }
    .tk-tags {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
    }
    .tk-tag {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.8);
    }

    /* Right side action buttons (TikTok style) */
    .tk-actions {
      position: absolute;
      right: 12px;
      bottom: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }
    .tk-action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .tk-action-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s;
    }
    .tk-action-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }
    .tk-action-btn.liked {
      background: rgba(255,92,147,0.25);
      color: var(--pink);
    }
    .tk-action-label {
      color: rgba(255,255,255,0.75);
      font-size: 11px;
    }

    /* Heart burst animation */
    @keyframes heartBurst {
      0% { transform: scale(1); }
      15% { transform: scale(1.4); }
      30% { transform: scale(0.95); }
      45% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .tk-action-btn.heart-anim { animation: heartBurst 0.5s ease; }

    /* Floating hearts on double tap */
    .tk-floating-heart {
      position: absolute;
      font-size: 80px;
      pointer-events: none;
      z-index: 50;
      animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: scale(0) translateY(0); }
      15% { opacity: 1; transform: scale(1.2) translateY(-20px); }
      100% { opacity: 0; transform: scale(0.8) translateY(-200px); }
    }

    /* Bottom chat button */
    .tk-bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tk-chat-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #fff;
      padding: 14px 24px;
      border-radius: 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      text-align: center;
      box-shadow: 0 4px 20px rgba(124,91,245,0.35);
    }
    .tk-chat-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(124,91,245,0.5); }

    .tk-share-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .tk-share-btn:hover { background: rgba(255,255,255,0.2); }

    /* Hint arrow animation */
    .tk-swipe-hint {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      animation: hintPulse 2s ease-in-out infinite;
      pointer-events: none;
    }
    .tk-swipe-hint .arrow { font-size: 18px; }
    @keyframes hintPulse {
      0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
      50% { opacity: 0.8; transform: translateX(-50%) translateY(-6px); }
    }

    /* Empty state */
    .wf-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text3);
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .story-page { margin-left: 0; }
      .story-topbar .mobile-menu { display: block; }
      .story-tabs { padding: 12px 14px 0; gap: 4px; }
      .story-tab { padding: 6px 14px; font-size: 12px; }
      .tk-story-text { font-size: 14px; padding-right: 56px; }
      .tk-actions { right: 8px; bottom: 160px; gap: 16px; }
      .tk-action-btn { width: 42px; height: 42px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <!-- Sidebar (same as index) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">次</div>
      <div class="logo-text">次元聊<span>CiYuanChat</span></div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/"><span class="nav-icon">🏠</span>发现角色</a>
      <a class="nav-item active" href="/story.html"><span class="nav-icon">📖</span>角色故事</a>
      <a class="nav-item" href="/?filter=female"><span class="nav-icon">👧</span>女性角色</a>
      <a class="nav-item" href="/?filter=male"><span class="nav-icon">👦</span>男性角色</a>
    </nav>
    <div class="sidebar-bottom">
      <a class="nav-item" href="/"><span class="nav-icon">⚙</span>AI 设置</a>
    </div>
  </aside>

  <div class="story-page">
    <div class="story-topbar">
      <button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h2>角色故事</h2>
      <div></div>
    </div>

    <div class="story-tabs" id="storyTabs">
      <button class="story-tab active" onclick="filterStories('all', this)">全部</button>
      <button class="story-tab" onclick="filterStories('daily', this)">日常</button>
      <button class="story-tab" onclick="filterStories('battle', this)">战斗</button>
      <button class="story-tab" onclick="filterStories('romance', this)">浪漫</button>
      <button class="story-tab" onclick="filterStories('funny', this)">搞笑</button>
      <button class="story-tab" onclick="filterStories('dark', this)">暗黑</button>
    </div>

    <div class="waterfall-wrap">
      <div class="waterfall" id="waterfall"></div>
    </div>
  </div>

  <!-- TikTok-style Fullscreen Viewer -->
  <div class="tk-viewer" id="tkViewer">
    <button class="tk-viewer-close" id="tkClose">&times;</button>
    <div class="tk-progress" id="tkProgress"></div>
    <div class="tk-scroll" id="tkScroll"></div>
  </div>

  <script>
    // ===== Story data =====
    const STORIES = [
      {
        charId: 'hancock', category: 'romance',
        scene: '九蛇岛 · 女帝的秘密花园',
        text: '今天路飞又没有回信...哼，那个笨蛋根本不懂女人的心！\n\n但是...一想到他的笑容，心脏就不受控制地跳动。这是什么感觉？难道这就是...恋爱吗？\n\n不行不行，本公主可是海贼女帝！绝对不能被一个男人牵着鼻子走！...可是，如果那个男人是路飞的话...也许...也不是不可以？',
        tags: ['恋爱', '日记', '女帝']
      },
      {
        charId: 'zoro', category: 'battle',
        scene: '新世界某座岛屿 · 雷鸣般的剑气',
        text: '三千世界！\n\n眼前的对手倒下了。但这远远不够。要成为世界第一大剑豪，还需要更强。\n\n鹰眼的背影至今还刻在脑海里。那一刀的差距，是天与地的距离。\n\n...算了，先去找个地方喝酒。话说，这座岛的东边到底在哪？明明一直往北走的...',
        tags: ['战斗', '修炼', '迷路']
      },
      {
        charId: 'nami', category: 'daily',
        scene: '万里阳光号 · 橘子树旁',
        text: '今天画完了新世界最新航路的海图！\n\n不过这帮家伙又把船弄得乱七八糟的。路飞偷吃了冰箱里的肉，山治和索隆又在吵架，乌索普在甲板上编故事吓唬乔巴...\n\n欠我的钱现在已经涨到3亿贝利了哦！加上利息的话——嘻嘻，想想就开心♪\n\n...看着这片大海，突然想起贝尔梅尔了。妈妈，我正在画你从未见过的海图呢。',
        tags: ['日常', '航海', '温馨']
      },
      {
        charId: 'ace', category: 'dark',
        scene: '处刑台前 · 最后的火焰',
        text: '"老爹...各位...还有路飞..."\n\n到了最后一刻，我终于明白了。活着，本身就是答案。\n\n我这一生，一直在追问自己——像我这样的人，真的有资格活在这个世界上吗？\n\n但是现在，看着你们为我流的泪...我知道了。\n\n谢谢你们爱我。',
        tags: ['暗黑', '感人', '离别']
      },
      {
        charId: 'robin', category: 'daily',
        scene: '万里阳光号图书室 · 月光下的阅读',
        text: '在空岛发现的历史正文中，记录着一段有趣的古代传说...\n\n"D之意志"，每次看到这个词，都会想起故乡奥哈拉的学者们。他们用生命守护的真相，我一定会找到答案。\n\n...今天的红茶很好喝。船长又在外面闹腾了呢。呵呵，这种热闹的感觉，真好。',
        tags: ['日常', '历史', '考古']
      },
      {
        charId: 'sanji', category: 'romance',
        scene: '万里阳光号 · 深夜的厨房',
        text: 'Mellorine~！\n\n今天娜美小姐说我做的蛋糕很好吃！罗宾小姐也微笑了！\n\n为了她们，我要做出更加美味的料理！这是男人的浪漫！\n\n...不过，All Blue到底在哪里呢？传说中汇聚了四海所有鱼类的幻之海域。\n\n等找到的那天，我要做出世界上最豪华的满汉全席！',
        tags: ['浪漫', '料理', '梦想']
      },
      {
        charId: 'luffy', category: 'funny',
        scene: '万里阳光号甲板 · 钓鱼时间',
        text: '嘻嘻！今天要钓一条超大的鱼！然后让山治做成烤肉！\n\n...等等，鱼不是肉来着？算了，反正能吃就行！\n\n啊！上钩了上钩了！拉——\n\n...钓上来一只海王类。好大！\n\n肉啊啊啊！！！',
        tags: ['搞笑', '吃货', '日常']
      },
      {
        charId: 'law', category: 'dark',
        scene: '潜水艇内 · 独自沉思',
        text: '"柯拉先生..."\n\n每当夜深人静，那场雪中的记忆就会浮现。\n\n白色的雪，红色的血，和那个永远不会消失的笑容。\n\n你用生命教会了我——"D"的意志不会灭亡。\n\n所以我还活着。带着你的份，继续走下去。',
        tags: ['暗黑', '回忆', '柯拉松']
      },
      {
        charId: 'yamato', category: 'battle',
        scene: '鬼岛 · 御田的继承者',
        text: '我是光月御田！\n\n...虽然大家都说我不是，但我的心和御田一样！这颗想要自由奔向大海的心！\n\n凯多那个老爹，总是把我关在鬼岛上。但是今天，路飞来了！\n\n终于！我要和他一起出海！我要亲眼看看御田的航海日志上描写的那些地方！\n\n雷鸣八卦！！！挡路的杂兵都给我让开！',
        tags: ['战斗', '自由', '热血']
      },
      {
        charId: 'reiju', category: 'romance',
        scene: '杰尔马王国 · 实验室阳台',
        text: '山治...你是我们兄妹中唯一拥有"心"的人。\n\n父亲改造了我们的血统因子，消除了感情。可是...为什么我看到你受伤的时候，胸口会这么疼？\n\n也许，母亲留下的东西...比父亲想象的更加强大。\n\n毒粉红。这是我的代号，也是我的宿命。用这毒之吻，我会守护你。',
        tags: ['浪漫', '亲情', '杰尔马']
      },
      {

    let allChars = [];
    let currentCategory = 'all';
    let filteredStories = [...STORIES];
    // Precompute stable like counts and comment counts per story index
    const stableLikes = STORIES.map(() => Math.floor(100 + Math.random() * 2400));
    const stableComments = STORIES.map(() => Math.floor(10 + Math.random() * 300));

    const CATEGORY_LABELS = {
      daily: '日常', battle: '战斗', romance: '浪漫', funny: '搞笑', dark: '暗黑'
    };
    const HEIGHT_CLASSES = ['wf-tall', 'wf-medium', 'wf-short'];

    async function init() {
      const resp = await fetch('/api/characters');
      allChars = await resp.json();
      filteredStories = [...STORIES];
      renderWaterfall();
    }

    function getChar(id) {
      return allChars.find(c => c.id === id);
    }

    // ===== Waterfall Rendering =====
    function renderWaterfall() {
      const container = document.getElementById('waterfall');
      if (filteredStories.length === 0) {
        container.innerHTML = '<div class="wf-empty">暂无该分类的故事</div>';
        return;
      }
      container.innerHTML = filteredStories.map((s, fi) => {
        const c = getChar(s.charId);
        if (!c) return '';
        const oi = STORIES.indexOf(s);
        const liked = localStorage.getItem(`liked_${oi}`);
        const likeCount = liked ? parseInt(liked) : stableLikes[oi];
        const hClass = HEIGHT_CLASSES[oi % 3];
        const plainText = s.text.replace(/\n/g, ' ');
        return `
          <div class="wf-card ${hClass}" onclick="openViewer(${fi})">
            <div class="wf-card-img">
              <img src="${c.image}" alt="${c.name}" loading="lazy" />
              <span class="wf-category">${CATEGORY_LABELS[s.category] || s.category}</span>
            </div>
            <div class="wf-card-body">
              <div class="wf-card-text">${plainText}</div>
              <div class="wf-card-footer">
                <div class="wf-card-author">
                  <img class="wf-card-avatar" src="${c.image}" alt="${c.name}" />
                  <span class="wf-card-name">${c.name}</span>
                </div>
                <div class="wf-card-likes">
                  <span class="heart">${liked ? '❤️' : '🤍'}</span>
                  <span>${likeCount >= 1000 ? (likeCount / 1000).toFixed(1) + 'k' : likeCount}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

        const commentCount = stableComments[oi];
        return `
          <div class="tk-slide" data-fi="${fi}" data-oi="${oi}">
            <img class="tk-slide-bg" src="${c.image}" alt="" />
            <img class="tk-slide-img-sharp" src="${c.image}" alt="" />
            <div class="tk-slide-overlay"></div>

            <div class="tk-header">
              <img class="tk-header-avatar" src="${c.image}" alt="${c.name}"
                onclick="event.stopPropagation(); location.href='/detail.html?id=${c.id}'" />
              <div class="tk-header-info">
                <div class="tk-header-name">${c.name}</div>
                <div class="tk-header-title">${c.title || ''}</div>
              </div>
            </div>

            <div class="tk-actions">
              <div class="tk-action-item">
                <button class="tk-action-btn ${liked ? 'liked' : ''}" onclick="event.stopPropagation(); tkToggleLike(this, ${oi})" data-oi="${oi}">
                  ${liked ? '❤️' : '🤍'}
                </button>
                <span class="tk-action-label tk-like-count" data-oi="${oi}">${likeCount >= 1000 ? (likeCount / 1000).toFixed(1) + 'k' : likeCount}</span>
              </div>
              <div class="tk-action-item">
                <button class="tk-action-btn" onclick="event.stopPropagation();">💬</button>
                <span class="tk-action-label">${commentCount}</span>
              </div>
              <div class="tk-action-item">
                <button class="tk-action-btn" onclick="event.stopPropagation();">🔗</button>
                <span class="tk-action-label">分享</span>
              </div>
            </div>

            <div class="tk-slide-content">
              <div class="tk-scene">${s.scene}</div>
              <div class="tk-story-text">${s.text.replace(/\n/g, '<br>')}</div>
              <div class="tk-tags">${s.tags.map(t => `<span class="tk-tag">#${t}</span>`).join('')}</div>
            </div>

            <div class="tk-bottom-bar">
              <button class="tk-chat-btn" onclick="event.stopPropagation(); goChat('${c.id}')">和 ${c.name} 聊天</button>
              <button class="tk-share-btn" onclick="event.stopPropagation();">↗</button>
            </div>

            ${fi === 0 && filteredStories.length > 1 ? '<div class="tk-swipe-hint"><span class="arrow">↑</span><span>上滑看更多</span></div>' : ''}
          </div>
        `;
      }).join('');

      // Build progress dots
      progress.innerHTML = filteredStories.map((_, i) =>
        `<div class="tk-progress-dot ${i === startIndex ? 'active' : ''}"></div>`
      ).join('');

      viewer.classList.add('open');
      document.body.style.overflow = 'hidden';

      // Scroll to the starting slide
      requestAnimationFrame(() => {
        const slides = scroll.querySelectorAll('.tk-slide');
        if (slides[startIndex]) {
          scroll.scrollTop = slides[startIndex].offsetTop;
        }
      });

      // Double-tap for like
      scroll.addEventListener('click', handleDoubleTap);
    }

    function closeViewer() {
      viewerOpen = false;
      const viewer = document.getElementById('tkViewer');
      const scroll = document.getElementById('tkScroll');
      viewer.classList.remove('open');
      document.body.style.overflow = '';
      scroll.removeEventListener('click', handleDoubleTap);
      // Refresh waterfall to reflect like changes
      renderWaterfall();
    }

    document.getElementById('tkClose').addEventListener('click', closeViewer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && viewerOpen) closeViewer();
    });

    // Scroll-snap observer to update progress dots
    document.getElementById('tkScroll').addEventListener('scroll', () => {
      const scroll = document.getElementById('tkScroll');
      const slides = scroll.querySelectorAll('.tk-slide');
      const scrollTop = scroll.scrollTop;
      const vh = window.innerHeight;
      let closest = 0;
      let minDist = Infinity;
      slides.forEach((slide, i) => {
        const dist = Math.abs(slide.offsetTop - scrollTop);
        if (dist < minDist) { minDist = dist; closest = i; }
      });
      if (closest !== currentSlideIndex) {
        currentSlideIndex = closest;
        updateProgressDots();
      }
    });

    function updateProgressDots() {
      const dots = document.querySelectorAll('.tk-progress-dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === currentSlideIndex));
    }

    // Like toggle in viewer
    function tkToggleLike(btn, oi) {
      const key = `liked_${oi}`;
      const labelEls = document.querySelectorAll(`.tk-like-count[data-oi="${oi}"]`);
      if (localStorage.getItem(key)) {
        localStorage.removeItem(key);
        btn.classList.remove('liked');
        btn.innerHTML = '🤍';
        const newCount = stableLikes[oi];
        labelEls.forEach(el => el.textContent = newCount >= 1000 ? (newCount / 1000).toFixed(1) + 'k' : newCount);
      } else {
        const newCount = stableLikes[oi] + 1;
        localStorage.setItem(key, newCount);
        btn.classList.add('liked');
        btn.innerHTML = '❤️';
        btn.classList.remove('heart-anim');
        void btn.offsetWidth; // reflow
        btn.classList.add('heart-anim');
        labelEls.forEach(el => el.textContent = newCount >= 1000 ? (newCount / 1000).toFixed(1) + 'k' : newCount);
      }
    }

    // Double-tap to like
    function handleDoubleTap(e) {
      const now = Date.now();
      if (now - lastTapTime < 350) {
        // Double tap detected
        const scroll = document.getElementById('tkScroll');
        const slides = scroll.querySelectorAll('.tk-slide');
        const slide = slides[currentSlideIndex];
        if (!slide) return;
        const oi = parseInt(slide.dataset.oi);
        const key = `liked_${oi}`;

        // Show floating heart
        const heart = document.createElement('div');
        heart.className = 'tk-floating-heart';
        heart.textContent = '❤️';
        heart.style.left = (e.clientX - 40) + 'px';
        heart.style.top = (e.clientY - 40) + 'px';
        slide.appendChild(heart);
        setTimeout(() => heart.remove(), 1000);

        // Like if not already liked
        if (!localStorage.getItem(key)) {
          const btn = slide.querySelector('.tk-action-btn[data-oi="' + oi + '"]');
          if (btn) tkToggleLike(btn, oi);
        }
      }
      lastTapTime = now;
    }

    function goChat(id) {
      const provider = localStorage.getItem('ai_provider') || 'anthropic';
      const key = localStorage.getItem(`apikey_${provider}`) || localStorage.getItem('anthropic_api_key');
      if (!key) {
        alert('请先在首页设置 API Key');
        location.href = '/';
        return;
      }
      location.href = `/chat.html?id=${id}`;
    }

    function filterStories(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.story-tab').forEach(t => t.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (category === 'all') {
        filteredStories = [...STORIES];
      } else {
        filteredStories = STORIES.filter(s => s.category === category);
      }
      renderWaterfall();
    }

    init();
  </script>
</body>
</html>
