<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a0a"/>
      <stop offset="100%" style="stop-color:#0d2d10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>
  <!-- Face -->
  <ellipse cx="200" cy="220" rx="85" ry="95" fill="#f5deb3"/>
  <!-- Green hair -->
  <path d="M115 180 Q120 110 160 130 Q170 90 200 110 Q230 80 250 120 Q280 100 285 180" fill="#27ae60"/>
  <path d="M115 180 Q115 160 125 155" fill="#27ae60"/>
  <path d="M285 180 Q285 160 275 155" fill="#27ae60"/>
  <!-- Left eye scar (closed) -->
  <line x1="152" y1="220" x2="188" y2="220" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="210" x2="168" y2="230" stroke="#8b0000" stroke-width="2" stroke-linecap="round"/>
  <!-- Right eye - sharp -->
  <path d="M212 210 L250 210 L250 230 L212 230 Z" fill="white"/>
  <ellipse cx="232" cy="220" rx="10" ry="10" fill="#1a1a1a"/>
  <circle cx="235" cy="217" r="3" fill="white"/>
  <!-- Sharp eyebrow -->
  <path d="M212 200 L255 195" fill="none" stroke="#27ae60" stroke-width="4" stroke-linecap="round"/>
  <!-- Stern mouth -->
  <line x1="175" y1="270" x2="225" y2="270" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Earrings on left ear -->
  <circle cx="118" cy="220" r="4" fill="#f1c40f"/>
  <circle cx="118" cy="232" r="4" fill="#f1c40f"/>
  <circle cx="118" cy="244" r="4" fill="#f1c40f"/>
  <!-- Body - green haramaki / dark coat -->
  <path d="M130 310 Q200 290 270 310 L290 500 L110 500 Z" fill="#1a3a1a"/>
  <rect x="155" y="330" width="90" height="170" rx="5" fill="#27ae60" opacity="0.8"/>
  <!-- Three swords behind -->
  <rect x="95" y="150" width="8" height="350" rx="4" fill="#888" transform="rotate(-10, 95, 150)"/>
  <rect x="100" y="160" width="8" height="340" rx="4" fill="#999" transform="rotate(-5, 100, 160)"/>
  <rect x="290" y="150" width="8" height="350" rx="4" fill="#777" transform="rotate(8, 290, 150)"/>
  <!-- Sword handles -->
  <rect x="90" y="140" width="18" height="30" rx="3" fill="#8b4513" transform="rotate(-10, 95, 150)"/>
  <rect x="95" y="150" width="18" height="30" rx="3" fill="#fff" transform="rotate(-5, 100, 160)"/>
  <rect x="285" y="140" width="18" height="30" rx="3" fill="#2c2c2c" transform="rotate(8, 290, 150)"/>
  <text x="200" y="480" text-anchor="middle" fill="white" font-size="24" font-family="sans-serif" font-weight="bold" opacity="0.8">ZORO</text>
</svg>