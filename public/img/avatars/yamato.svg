<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#051a18"/>
      <stop offset="100%" style="stop-color:#0a2d28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>
  <!-- Horns (oni mask style) -->
  <path d="M140 135 L120 70 L145 110" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
  <path d="M260 135 L280 70 L255 110" fill="#c0392b" stroke="#922b21" stroke-width="2"/>
  <!-- Face -->
  <ellipse cx="200" cy="225" rx="78" ry="90" fill="#fce4b8"/>
  <!-- White hair with teal/green tips -->
  <path d="M118 190 Q130 95 170 125 Q185 75 210 110 Q235 70 255 120 Q275 90 282 190" fill="white"/>
  <path d="M118 190 Q108 260 105 360" fill="white"/>
  <path d="M282 190 Q292 260 295 360" fill="white"/>
  <!-- Teal tips -->
  <path d="M105 300 Q105 340 108 380" fill="#1abc9c" opacity="0.7"/>
  <path d="M295 300 Q295 340 292 380" fill="#1abc9c" opacity="0.7"/>
  <!-- Red horned headband -->
  <rect x="130" y="150" width="140" height="10" rx="5" fill="#c0392b"/>
  <!-- Eyes - determined, fierce -->
  <ellipse cx="170" cy="225" rx="17" ry="18" fill="white"/>
  <ellipse cx="230" cy="225" rx="17" ry="18" fill="white"/>
  <circle cx="172" cy="223" r="11" fill="#e67e22"/>
  <circle cx="232" cy="223" r="11" fill="#e67e22"/>
  <circle cx="176" cy="219" r="4" fill="white"/>
  <circle cx="236" cy="219" r="4" fill="white"/>
  <!-- Strong eyebrows -->
  <path d="M150 208 Q168 195 188 208" fill="none" stroke="#888" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212 208 Q232 195 250 208" fill="none" stroke="#888" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Determined smile -->
  <path d="M172 268 Q200 285 228 268" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Side face markings -->
  <line x1="130" y1="230" x2="145" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="130" y1="240" x2="145" y2="250" stroke="#c0392b" stroke-width="2"/>
  <line x1="270" y1="230" x2="255" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="270" y1="240" x2="255" y2="250" stroke="#c0392b" stroke-width="2"/>
  <!-- Body - sleeveless outfit -->
  <path d="M135 310 Q200 295 265 310 L275 500 L125 500 Z" fill="#1abc9c"/>
  <!-- Rope belt -->
  <path d="M135 350 Q200 360 265 350" fill="none" stroke="#f5f5dc" stroke-width="6"/>
  <!-- Kanabo club behind -->
  <rect x="85" y="200" width="18" height="300" rx="9" fill="#555"/>
  <circle cx="94" cy="205" r="15" fill="#666"/>
  <!-- Spikes on club -->
  <circle cx="82" cy="200" r="4" fill="#888"/>
  <circle cx="106" cy="200" r="4" fill="#888"/>
  <circle cx="94" cy="190" r="4" fill="#888"/>
  <text x="200" y="480" text-anchor="middle" fill="white" font-size="22" font-family="sans-serif" font-weight="bold" opacity="0.8">YAMATO</text>
</svg>