  <script>
    let allChars = [];
    let currentFilter = 'all';

    async function loadCharacters() {
      const resp = await fetch('/api/characters');
      allChars = await resp.json();
      document.getElementById('charCount').textContent = allChars.length;
      // Sort: women first by default
      allChars.sort((a, b) => {
        if (a.gender === 'female' && b.gender !== 'female') return -1;
        if (a.gender !== 'female' && b.gender === 'female') return 1;
        return 0;
      });
      renderChars(allChars);
      renderStories();
      renderHeroAvatars();
    }

    function renderChars(chars) {
      const grid = document.getElementById('charGrid');
      grid.innerHTML = chars.map(c => `
        <div class="char-card" onclick="openDetail('${c.id}')" data-gender="${c.gender}">
          <div class="char-card-img">
            <img src="${c.image}" alt="${c.name}" loading="lazy"
              onerror="this.style.display='none';this.parentElement.style.background='${c.gradient}'" />
            <div class="card-overlay">
              <div class="card-status"><span class="online-dot"></span>在线</div>
              <div class="card-bottom">
                <div class="card-name">${c.name}</div>
                <div class="card-title">${c.title}</div>
                <div class="card-tags">
                  ${c.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                </div>
                <div class="card-action">
                  <span class="card-chat-btn">💬 聊天</span>
                  <span class="card-detail-btn">查看详情 →</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterChars(gender, btn) {
      currentFilter = gender;
      // Update pills
      document.querySelectorAll('.filter-pill').forEach(t => t.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      } else {
        document.querySelectorAll('.filter-pill').forEach(t => {
          if ((gender === 'all' && t.textContent === '全部') ||
              (gender === 'female' && t.textContent === '女生') ||
              (gender === 'male' && t.textContent === '男生')) {
            t.classList.add('active');
          }
        });
      }
      // Update sidebar
      document.querySelectorAll('.sidebar-nav .nav-item').forEach((n, i) => {
        n.classList.remove('active');
        if ((gender === 'all' && i === 0) || (gender === 'female' && i === 2) || (gender === 'male' && i === 3))
          n.classList.add('active');
      });

      const filtered = gender === 'all' ? allChars : allChars.filter(c => c.gender === gender);
      renderChars(filtered);
      // Also update stories to match filter
      renderStories();
    }

    function openDetail(id) {
      window.location.href = `/detail.html?id=${id}`;
    }

    function onProviderChange() {
      const provider = document.getElementById('providerSelect').value;
      document.querySelectorAll('.key-section').forEach(s => s.style.display = 'none');
      document.getElementById(`keySection-${provider}`).style.display = 'block';
    }

    function showSettings() { document.getElementById('settingsModal').classList.add('show'); }
    function hideSettings() { document.getElementById('settingsModal').classList.remove('show'); }
    function saveSettings() {
      const provider = document.getElementById('providerSelect').value;
      const key = document.getElementById(`apiKey-${provider}`).value.trim();
      if (key) {
        localStorage.setItem('ai_provider', provider);
        localStorage.setItem(`apikey_${provider}`, key);
        if (provider === 'anthropic') localStorage.setItem('anthropic_api_key', key);
        hideSettings();
      }
    }

    document.getElementById('settingsModal').addEventListener('click', function(e) {
      if (e.target === this) hideSettings();
    });

    // Load saved settings
    const savedProvider = localStorage.getItem('ai_provider') || 'anthropic';
    document.getElementById('providerSelect').value = savedProvider;
    onProviderChange();
    ['anthropic','openai','gemini','deepseek'].forEach(p => {
      const k = localStorage.getItem(`apikey_${p}`);
      if (k) document.getElementById(`apiKey-${p}`).value = k;
    });
    const oldKey = localStorage.getItem('anthropic_api_key');
    if (oldKey && !localStorage.getItem('apikey_anthropic')) {
      localStorage.setItem('apikey_anthropic', oldKey);

    // Per-character, randomly pick 3 stories for this session
    const TIMES = ['1小时前', '2小时前', '3小时前', '4小时前', '5小时前', '6小时前',

    let activeStories = []; // [{charId, scene, text, time}, ...]

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildActiveStories() {
      // Filter story pool characters by current gender filter
      let charIds = Object.keys(STORY_POOL);
      if (currentFilter !== 'all') {
        charIds = charIds.filter(cid => {
          const c = allChars.find(ch => ch.id === cid);
          return c && c.gender === currentFilter;
        });
      }
      // Women first sorting
      charIds.sort((a, b) => {
        const ca = allChars.find(ch => ch.id === a);
        const cb = allChars.find(ch => ch.id === b);
        if (ca && cb) {
          if (ca.gender === 'female' && cb.gender !== 'female') return -1;
          if (ca.gender !== 'female' && cb.gender === 'female') return 1;
        }
        return 0;
      });
      charIds = shuffle(charIds);
      // Show up to 20 characters
      const picked = charIds.slice(0, 20);
      activeStories = [];
      let timeIdx = 0;
      for (const cid of picked) {
        const pool = STORY_POOL[cid];
        const selected = shuffle(pool).slice(0, 3);
        for (const s of selected) {
          activeStories.push({ charId: cid, scene: s.scene, text: s.text, time: TIMES[timeIdx % TIMES.length] });
          timeIdx++;
        }
      }
    }

    let storyIdx = 0;

      const row = document.getElementById('storiesRow');
      if (!allChars.length) return;
      buildActiveStories();
      // Group by charId for bubble display — show one bubble per char
      const charOrder = [];
      const seen = new Set();
      for (const s of activeStories) {
        if (!seen.has(s.charId)) {
          seen.add(s.charId);
          charOrder.push(s.charId);
        }
      }
      row.innerHTML = charOrder.map((cid, i) => {
        const c = allChars.find(ch => ch.id === cid);
        if (!c) return '';
        return `
          <div class="story-bubble" onclick="openStoryForChar('${cid}')">
            <div class="story-ring">

            <div class="story-bubble-name">${c.name}</div>

      }).join('');

      const seen = new Set();
      for (const s of activeStories) {
        if (!seen.has(s.charId)) { seen.add(s.charId); order.push(s.charId); }
      }
      return order;
    }

    let currentCharId = null;
    let currentSubIdx = 0;

    function openStoryForChar(charId) {
      currentCharId = charId;
      currentSubIdx = 0;
      document.getElementById('storyViewer').classList.add('open');
      document.body.style.overflow = 'hidden';
      showCurrentStory();
    }

    function openStory(idx) {
      // legacy compat
      const s = activeStories[idx];
      if (s) openStoryForChar(s.charId);
    }

    function closeStory() {
      clearTimeout(storyTimer);
      document.getElementById('storyViewer').classList.remove('open');
      document.body.style.overflow = '';
    }

    function prevStory() {
      clearTimeout(storyTimer);
      const charStories = getCharStories(currentCharId);
      if (currentSubIdx > 0) {
        currentSubIdx--;
      } else {
        // Go to previous character
        const order = getCharOrder();
        const ci = order.indexOf(currentCharId);
        if (ci > 0) {
          currentCharId = order[ci - 1];
          currentSubIdx = getCharStories(currentCharId).length - 1;
        } else {
          // wrap to last char, last story
          currentCharId = order[order.length - 1];
          currentSubIdx = getCharStories(currentCharId).length - 1;
        }
      }
      showCurrentStory();
    }

    function nextStory() {
      clearTimeout(storyTimer);
      const charStories = getCharStories(currentCharId);
      if (currentSubIdx < charStories.length - 1) {
        currentSubIdx++;
      } else {
        // Go to next character
        const order = getCharOrder();
        const ci = order.indexOf(currentCharId);
        if (ci < order.length - 1) {
          currentCharId = order[ci + 1];
          currentSubIdx = 0;
        } else {
          closeStory();
          return;
        }
      }
      showCurrentStory();
    }

    function showCurrentStory() {
      clearTimeout(storyTimer);
      const charStories = getCharStories(currentCharId);
      const s = charStories[currentSubIdx];
      const c = allChars.find(ch => ch.id === currentCharId);
      if (!s || !c) return;

      document.getElementById('svBg').src = c.image;
      document.getElementById('svAvatar').src = c.image;
      document.getElementById('svName').textContent = c.name;
      document.getElementById('svTime').textContent = s.time;
      document.getElementById('svScene').textContent = s.scene;
      document.getElementById('svText').textContent = s.text;
      document.getElementById('svChatBtn').onclick = () => {
        closeStory();
        window.location.href = `/chat.html?id=${s.charId}`;
      };

      // Progress bars — one per story in this character's set
      const prog = document.getElementById('svProgress');
      prog.innerHTML = charStories.map((_, i) => {
        const cls = i < currentSubIdx ? 'done' : i === currentSubIdx ? 'active' : '';
        return `<div class="sv-progress-bar ${cls}"><div class="fill"></div></div>`;
      }).join('');

      const activeBar = prog.querySelector('.sv-progress-bar.active .fill');
      if (activeBar) {
        requestAnimationFrame(() => {
          activeBar.style.transition = `width ${STORY_DURATION}ms linear`;
          activeBar.style.width = '100%';
        });
      }

      storyTimer = setTimeout(() => nextStory(), STORY_DURATION);
    }

    function renderHeroAvatars() {
      const container = document.getElementById('heroAvatars');
      // Pick 8 random featured characters for the banner
      const featured = shuffle(allChars.filter(c => c.gender === 'female')).slice(0, 8);
      container.innerHTML = featured.map(c => `
        <div class="hero-avatar-item" onclick="openDetail('${c.id}')">
          <img src="${c.image}" alt="${c.name}" onerror="this.style.display='none'" />
        </div>
      `).join('');
    }

    // Keyboard navigation for story viewer
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('storyViewer').classList.contains('open')) return;
      if (e.key === 'Escape') closeStory();
      if (e.key === 'ArrowLeft') prevStory();
      if (e.key === 'ArrowRight') nextStory();
    });

    loadCharacters();
  </script>
</body>
</html>
